[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-platform"
version = "0.2.0"
description = "多智能体协作平台 —— 产品经理 | 程序员 | 测试员，主Agent 调度"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "jaxon" }]

dependencies = [
    "openai>=1.12.0",
    "anthropic>=0.30.0",
    "chromadb>=0.5.0",
    "gradio>=4.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "bcrypt>=4.1.0",
    "redis>=5.0.0",
    "requests>=2.31.0",
    "jsonschema>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27.0",
    "black>=24.0",
    "ruff>=0.3.0",
]
langgraph = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
]

[project.scripts]
agent-platform = "agent_platform.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.ruff]
line-length = 120
target-version = "py311"
