[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-platform"
version = "0.2.0"
description = "多智能体协作平台 —— 产品经理 | 程序员 | 测试员，主Agent 调度"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "jaxon" }]

dependencies = [
    # 全部加上界：只给下限时 `pip install -e .` 会装上未来的大版本
    # （实测拉过 langgraph 1.2 / openai 3.35，而代码是按 0.x/1.x 写的），
    # 一次重装就能把"昨天还好好的"变成一堆 API 不兼容。
    "openai>=1.12.0,<4",
    "anthropic>=0.30.0,<2",
    "chromadb>=0.5.0,<2",
    "fastapi>=0.110.0,<1",
    "uvicorn[standard]>=0.27.0,<1",
    "pydantic>=2.6.0,<3",
    "sqlalchemy>=2.0.0,<3",
    "pymysql>=1.1.0,<2",
    "requests>=2.31.0,<3",
    "jsonschema>=4.0.0,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "pytest-asyncio>=0.23,<2",
    "httpx>=0.27.0,<1",
    "black>=24.0",
    "ruff>=0.3.0",
]
langgraph = [
    "langgraph>=0.2.0,<2",
    "langchain-core>=0.3.0,<2",
]

[project.scripts]
agent-platform = "agent_platform.main:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
# 缓存也收进 .data，根目录不再出现 .pytest_cache/
cache_dir = ".data/cache/pytest"
testpaths = ["tests"]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.ruff]
line-length = 120
target-version = "py311"
cache-dir = ".data/cache/ruff"

# 显式声明规则集：不写 select 时，ruff 的默认规则随版本变化，
# 同一条 `ruff check` 在 CI 上会因为 ruff 升级突然多出几百条告警。
# 这里只开"真能抓到 bug"的几组，风格类交给 black。
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# __init__.py 是包的对外出口，这里的"未使用导入"就是 re-export
"__init__.py" = ["F401"]
# 测试文件要先插 sys.path 再导入，且故意导入符号来验证导出面
"tests/*" = ["E402", "F401"]

